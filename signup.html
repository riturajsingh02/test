<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Create Account — The Candleier</title>
  <link rel="icon" type="image/x-icon" href="asset/logo.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Monsieur+La+Doulaise&family=Cormorant+Garamond:wght@400;600&family=Montserrat:wght@300;400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <header class="site-header">
    <div class="nav-left-group">
      <div class="nav-brand">
        <a href="index.html">
          <h1 class="brand-title">The Candleier</h1>
          <span class="brand-tagline">Light Up Your Moments</span>
        </a>
      </div>
    </div>
    <div class="nav-actions">
      <a href="tracking.html" class="action-btn" title="Track Order">Track Order</a>
      <a href="login.html" class="action-btn" title="Sign In">Sign In</a>
    </div>
  </header>

  <main style="padding: 4rem 1.5rem; display: flex; justify-content: center; align-items: center; min-height: 80vh;">
    <div class="checkout-modal active" style="position: relative; top: auto; left: auto; transform: none; width: 100%; max-width: 460px; box-shadow: var(--shadow-lg);">
      <span class="section-pretitle" style="text-align: center;">Join Our Sanctuary</span>
      <h3 class="checkout-title" style="text-align: center; margin-bottom: 2rem;">Create Account</h3>

      <form id="signupForm" onsubmit="handleSignup(event)">
        <div class="form-group">
          <label for="signupName">Full Name</label>
          <input type="text" id="signupName" required placeholder="Enter your full name" />
        </div>

        <div class="form-group">
          <label for="signupEmail">Email Address</label>
          <input type="email" id="signupEmail" required placeholder="name@example.com" />
        </div>

        <div class="form-group">
          <label for="signupPassword">Password</label>
          <input type="password" id="signupPassword" required placeholder="Create a secure password" />
        </div>

        <button type="submit" class="btn btn-gold btn-block" style="margin-top: 1.5rem;">Register Account</button>
      </form>

      <p style="text-align: center; font-size: 0.82rem; margin-top: 1.5rem; color: var(--text-muted);">
        Already have an account? <a href="login.html" style="color: var(--maroon-light); font-weight: 600; text-decoration: underline;">Sign In</a>
      </p>
    </div>
  </main>

  <footer class="site-footer" style="padding: 2rem 5%;">
    <div class="footer-bottom" style="border: none; padding: 0; justify-content: center;">
      <p>© 2026 The Candleier. All rights reserved.</p>
    </div>
  </footer>

  <script>
    function handleSignup(e) {
      e.preventDefault();
      alert("Account created successfully! Welcome to The Candleier community.");
      window.location.href = "index.html";
    }
  </script>
</body>
</html>
