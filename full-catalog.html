<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>All Candles — The Candleier</title>
  <link rel="icon" type="image/x-icon" href="asset/logo.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Monsieur+La+Doulaise&family=Cormorant+Garamond:wght@400;600&family=Montserrat:wght@300;400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <!-- HEADER -->
  <header class="site-header">
    <div class="nav-left-group">
      <div class="nav-brand">
        <a href="index.html">
          <h1 class="brand-title">The Candleier</h1>
          <span class="brand-tagline">Light Up Your Moments</span>
        </a>
      </div>
    </div>
    <div class="nav-actions">
      <a href="index.html" class="action-btn">Return Home</a>
    </div>
  </header>

  <!-- FULL CATALOG -->
  <main style="padding-top: 3rem;">
    <section class="catalog-section" id="catalog">
      <div class="catalog-layout-pro">
        <div class="catalog-toolbar pro-toolbar">
          <div class="toolbar-left">
            <h2 class="category-heading">Full Collection</h2>
            <span class="product-count" id="productCountText">All Products</span>
          </div>
          <div class="toolbar-right">
            <div class="pro-filters">
              <div class="filter-dropdown">
                <button class="filter-dropdown-btn">Category <span class="arrow">▼</span></button>
                <div class="filter-menu">
                  <label class="filter-check"><input type="checkbox" class="type-filter" value="Premium Luxury Candles"> <span>Premium Luxury Candles</span></label>
                  <label class="filter-check"><input type="checkbox" class="type-filter" value="Metal Collection"> <span>Metal Collection</span></label>
                  <label class="filter-check"><input type="checkbox" class="type-filter" value="Diffusers and Aromas"> <span>Diffusers and Aromas</span></label>
                </div>
              </div>
            </div>
            <div class="search-wrap-small">
              <input type="text" id="searchInput" placeholder="Search notes..." aria-label="Search">
            </div>
            <div class="sort-wrap">
              <select id="sortSelect" class="sort-select">
                <option value="recommended">Sort: Recommended</option>
                <option value="price-low">Price: Low to High</option>
                <option value="price-high">Price: High to Low</option>
              </select>
            </div>
          </div>
        </div>
        <div class="product-grid" id="productGrid" aria-live="polite"></div>
      </div>
    </section>
  </main>

  <script src="js/core/data.js"></script>
  <script src="js/core/state.js"></script>
  <script src="js/core/dom.js"></script>
  <script src="js/features/toast.js"></script>
  <script src="js/features/catalog.js"></script>
  <script src="js/features/cart.js"></script>
  <script src="js/features/wishlist.js"></script>
  <script src="js/features/product.js"></script>
  <script src="js/features/checkout.js"></script>
  <script src="js/features/account-tracking.js"></script>
  <script src="js/features/policies.js"></script>
  <script src="js/features/events.js"></script>
</body>
</html>
